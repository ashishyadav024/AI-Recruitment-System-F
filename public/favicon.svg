<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006389" />
      <stop offset="50%" stop-color="#007dac" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#006389" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="32" height="32" rx="8" fill="url(#aiGrad)" filter="url(#glow)"/>
  <!-- Stylized AI Brain / Network Nodes -->
  <g fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center node -->
    <circle cx="16" cy="16" r="2.5" fill="#ffffff" />
    <!-- Outer nodes -->
    <circle cx="10" cy="11" r="1.8" fill="#ffffff" />
    <circle cx="22" cy="11" r="1.8" fill="#ffffff" />
    <circle cx="9" cy="20" r="1.8" fill="#ffffff" />
    <circle cx="23" cy="20" r="1.8" fill="#ffffff" />
    <circle cx="16" cy="25" r="1.8" fill="#ffffff" />
    <!-- Connections -->
    <path d="M10 11 L16 16 L22 11" stroke-width="1.4" opacity="0.9" />
    <path d="M9 20 L16 16 L23 20" stroke-width="1.4" opacity="0.9" />
    <path d="M16 16 L16 25" stroke-width="1.4" opacity="0.9" />
    <path d="M10 11 C 7 14, 7 17, 9 20" stroke-width="1.2" opacity="0.6" stroke-dasharray="1 1" />
    <path d="M22 11 C 25 14, 25 17, 23 20" stroke-width="1.2" opacity="0.6" stroke-dasharray="1 1" />
  </g>
</svg>
